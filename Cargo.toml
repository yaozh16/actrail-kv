[workspace]
resolver = "2"
members = [
    "artifacts",
    "receiver",
    "analyzer",
    "reporter",
    "cmd/receiver",
    "cmd/analyze",
    "cmd/report",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
actrail-kv-artifacts = { path = "artifacts" }
actrail-kv-receiver = { path = "receiver" }
actrail-kv-analyzer = { path = "analyzer" }
actrail-kv-reporter = { path = "reporter" }
anyhow = "1.0"
axum = "0.8"
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
html-escape = "0.2"
proptest = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
same-file = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
tower = { version = "0.5", features = ["util"] }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
